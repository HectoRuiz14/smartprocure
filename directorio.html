<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio - SmartPro B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold tracking-tight text-blue-400">SmartPro B2B</h1>
                <p class="text-xs text-slate-400 mt-1">Panel de Administrador</p>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="index.html" class="block px-4 py-3 hover:bg-slate-800 rounded-lg text-sm font-medium transition-colors">Licitaciones Activas</a>
                <a href="directorio.html" class="block px-4 py-3 bg-blue-600 rounded-lg text-sm font-medium transition-colors">Directorio Proveedores</a>
                <a href="reportes.html" class="block px-4 py-3 hover:bg-slate-800 rounded-lg text-sm font-medium transition-colors">Reportes Financieros</a>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center font-bold">H</div>
                    <div class="text-sm">
                        <p class="font-medium">Héctor Ruiz</p>
                        <p class="text-xs text-slate-400">Comprador</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Contenido Central: Directorio -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-gray-50">
            <header class="bg-white shadow-sm border-b border-gray-200 px-8 py-4 flex justify-between items-center z-10">
                <h2 class="text-xl font-semibold text-gray-800">Gestión de Proveedores</h2>
            </header>

            <div class="p-8">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-12">
                    <div class="p-6 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800">Directorio General</h3>
                        </div>
                        <div class="flex gap-3">
                            <!-- Input con ID agregado -->
                            <input type="text" id="buscador" placeholder="Buscar por NIT o empresa..." class="px-4 py-2 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                                + Añadir Proveedor
                            </button>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-sm text-gray-500 bg-white border-b border-gray-200">
                                    <th class="p-4 font-medium">Razón Social</th>
                                    <th class="p-4 font-medium">NIT</th>
                                    <th class="p-4 font-medium text-center">Estado</th>
                                </tr>
                            </thead>
                            <tbody class="text-sm text-gray-700">
                                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                                    <td class="p-4 font-medium text-gray-900">Ferretería El Cóndor SAS</td>
                                    <td class="p-4 text-gray-600">900.123.456-7</td>
                                    <td class="p-4 text-center"><span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-semibold">Verificado</span></td>
                                </tr>
                                <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                                    <td class="p-4 font-medium text-gray-900">Papelería Universal</td>
                                    <td class="p-4 text-gray-600">800.987.654-3</td>
                                    <td class="p-4 text-center"><span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full font-semibold">Verificado</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script del buscador -->
    <script>
        const buscador = document.getElementById('buscador');
        
        if(buscador) {
            buscador.addEventListener('keyup', function(evento) {
                const textoBusqueda = evento.target.value.toLowerCase();
                const filas = document.querySelectorAll('tbody tr');
                
                filas.forEach(fila => {
                    const contenidoFila = fila.textContent.toLowerCase();
                    if(contenidoFila.includes(textoBusqueda)) {
                        fila.style.display = '';
                    } else {
                        fila.style.display = 'none';
                    }
                });
            });
        }
    </script>
</body>
</html>
